<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
    @font-face {
        font-family: 'Pixellari';
        /* แก้ path ฟอนต์ Pixellari */
        src: url('../public/font/pixellari/Pixellari.ttf') format('truetype');
    }

    @font-face {
        font-family: 'SOV_BokThang';
        /* แก้ path ฟอนต์ SOV_BokThang */
        src: url('../public/font/SOV_BokThang/SOV_BokThang.ttf') format('truetype');
        size-adjust: 125%;
    }

    .font-pixel {
        font-family: 'Pixellari', 'SOV_BokThang', sans-serif !important;
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e88d67;
        border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #d67b55;
    }
</style>

</head>

<!-- แก้ path รูปพื้นหลัง -->
<body class="flex flex-col min-h-screen bg-[url('../public/image/bg2.png')] font-pixel">
    <!-- Navbar -->
    <nav
        class="flex justify-between items-center bg-[#ffb6c1] p-3 px-10 fixed top-0 left-0 w-full shadow-md shadow-[#e5acb5] z-50">
        <div>
            <a href="./menu.html">
                <!-- แก้ path รูป home -->
                <img class="w-9 hover:scale-115 active:scale-95 transition-transform" src="../public/image/home.png"
                    alt="home">
            </a>
        </div>

        <div class="dropdown dropdown-center">
            <div tabindex="0" role="button" class="flex items-center gap-3 cursor-pointer active:scale-95">
                <h1 id="current-week-label"
                    class="text-white text-2xl font-bold tracking-wider uppercase drop-shadow mt-3">
                    WEEK 1/52
                </h1>
                <div>
                    <!-- แก้ path รูป triangle -->
                    <img class="w-5" src="../public/image/triangle.png" alt="triangle">
                </div>
            </div>

            <ul tabindex="0" id="week-dropdown-list"
                class="dropdown-content menu bg-base-100 rounded-box z-50 w-48 p-2 shadow-lg mt-1 max-h-80 overflow-y-auto custom-scrollbar">
            </ul>
        </div>

        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button"
                class="bg-white rounded-full shadow-md shadow-[#e5acb5] cursor-pointer group active:scale-95">
                <!-- แก้ path รูป paw -->
                <img class="w-12 group-hover:scale-115 transition-transform" src="../public/image/paw.png" alt="paw">
            </div>
            <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-36 p-2 shadow-lg mt-1">
                <li><a href="./profile.html">My profile</a></li>
                <li><a id="btn-logout-nav" class="cursor-pointer">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Container หลัก -->
    <div class=" pt-28 p-6 grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 w-full items-start">

        <!-- 1. กล่องปฏิทิน -->
        <div class="relative w-full pt-2 pb-1.5 px-1.5 bg-[#9c7356] rounded-3xl shadow-xl text-white flex flex-col h-fit mt-8">
            <!-- แก้ path รูป cats_top -->
            <img src="../public/image/planner/cats_top.png" class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 z-10" alt="Cats Top">
            <div id="month-title" class="text-center font-bold text-lg tracking-wider my-1"></div>

            <div class="bg-white rounded-b-2xl p-2 text-[#5c3d2e] font-bold">
                <div class="w-full mb-1">
                    <!-- แก้ path รูป cat_day -->
                    <img src="../public/image/planner/cat_day.png" class="w-full h-auto object-contain" alt="Cat Days Header">
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-y-1 text-center text-xs"></div>
            </div>
        </div>

        <!-- 2. กล่อง To-Do -->
        <div id="todo-container" class="contents max-h-[70vh] overflow-y-auto custom-scrollbar"></div>

    </div>

    <!-- ==================== MODAL 1: ADD TASK ==================== -->
    <dialog id="add_task_modal" class="modal">
        <div class="modal-box bg-white rounded-3xl p-6 max-w-sm flex flex-col items-center gap-4 text-[#5c3d2e]">
            <h3 id="modal-day-title" class="font-bold text-xl uppercase tracking-wider text-[#dc7a5d]">MONDAY</h3>

            <input type="text" id="todo-input" placeholder="Your task....."
                class="w-full px-4 py-2 text-center rounded-full border-2 border-[#fbe4c0] focus:outline-none focus:border-[#dc7a5d] text-[#5c3d2e] placeholder-[#e0bba1]">

            <div class="flex gap-2 w-full justify-center mt-2">
                <button id="btn-save-todo"
                    class="bg-[#fbe4c0] hover:bg-[#f5ddb7] text-[#9c7356] font-bold py-1.5 px-8 rounded-2xl active:scale-95 shadow-xs cursor-pointer">ADD</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop bg-black/30">
            <button>close</button>
        </form>
    </dialog>

    <!-- ==================== MODAL 2: CALENDAR EVENT ==================== -->
    <dialog id="calendar_modal" class="modal">
        <div class="modal-box bg-white rounded-3xl p-6 max-w-2xl flex gap-6 items-start text-[#5c3d2e]">

            <!-- ฝั่งซ้าย: ปฏิทิน -->
            <div class="w-1/2 bg-[#9c7356] rounded-2xl p-2 text-white flex flex-col justify-between h-fit">
                <div class="flex justify-between items-center px-2 mb-2 font-bold">
                    <button id="modal-prev-month" class="hover:scale-125 transition-transform cursor-pointer">◀</button>
                    <span id="modal-month-title" class="tracking-wider text-sm">MAY 2026</span>
                    <button id="modal-next-month" class="hover:scale-125 transition-transform cursor-pointer">▶</button>
                </div>
                <div class="bg-white rounded-xl p-2 text-[#5c3d2e]">
                    <div class="w-full mb-1">
                        <!-- แก้ path รูป cat_day -->
                        <img src="../public/image/planner/cat_day.png" class="w-full h-auto object-contain" alt="Cat Days">
                    </div>
                    <div id="modal-calendar-days" class="grid grid-cols-7 gap-y-1 text-center text-xs font-bold"></div>
                </div>
            </div>

            <!-- ฝั่งขวา: รายการ Event & เพิ่ม Event -->
            <div class="w-1/2 border-2 border-[#9c7356] bg-white rounded-3xl flex flex-col justify-between overflow-hidden shadow-sm">
                <!-- Header หัวข้อวันที่ -->
                <div class="bg-[#9c7356] py-3 text-center">
                    <h4 id="modal-selected-date" class="font-bold text-white text-lg lowercase tracking-wider">
                        friday 1 may
                    </h4>
                </div>

                <!-- ส่วนตรงกลาง -->
                <div class="p-4 flex-1 flex flex-col justify-center items-center">
                    <div id="modal-event-list" class="w-full flex flex-col gap-2 max-h-40 overflow-y-auto px-1 custom-scrollbar">
                    </div>
                </div>

                <!-- ส่วนท้าย -->
                <div class="p-4 flex flex-col gap-2 border-t border-[#9c7356]/10">
                    <input type="text" id="modal-event-input" placeholder="+ Add event..."
                        class="w-full px-3 py-1.5 text-xs rounded-full border border-[#9c7356]/40 bg-[#fef8f0] text-[#5c3d2e] placeholder-[#9c7356]/60 focus:outline-none focus:border-[#9c7356]">

                    <div class="flex justify-center">
                        <button id="btn-save-event"
                            class="bg-[#fbe4c0] hover:bg-[#f5ddb7] text-[#9c7356] font-bold text-sm py-1 px-8 rounded-full active:scale-95 shadow-xs cursor-pointer">ADD</button>
                    </div>
                </div>
            </div>

        </div>
        <form method="dialog" class="modal-backdrop bg-black/30">
            <button>close</button>
        </form>
    </dialog>

    <!-- แก้ path ของสคริปต์ JS เป็น Relative Path -->
    <script type="module" src="./planner.js"></script>
</body>

</html>
