<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
    @font-face {
        font-family: 'Pixellari';
        src: url('../public/font/pixellari/Pixellari.ttf') format('truetype');
    }

    @font-face {
        font-family: 'SOV_BokThang';
        src: url('../public/font/SOV_BokThang/SOV_BokThang.ttf') format('truetype');
        size-adjust: 125%;
    }

    .font-pixel {
        font-family: 'Pixellari', 'SOV_BokThang', sans-serif !important;
    }
    </style>

</head>

<body class="font-pixel flex min-h-screen justify-center items-center bg-[url('../public/image/bg.png')] bg-cover bg-center p-4">
    
    <!-- โครงสร้างหลัก จัดกึ่งกลางหน้าจอ -->
    <div class="flex flex-col items-center w-full max-w-[380px]">

        <!-- 1. ส่วนแมว: อยู่ด้านบนของกล่องการ์ด ปรับขยับขึ้นลงได้อิสระ -->
        <div class="w-full flex justify-center -mb-28 z-0">
            <img id="cat-img" src="../public/image/cat-login.png" 
                 class="w-[280px] transition-transform duration-300 pointer-events-none -translate-y-3">
        </div>

        <!-- 2. ส่วนกล่องการ์ดสีขาว: ซ้อนทับส่วนล่างของแมวพอดี -->
        <div class="relative z-10 bg-white border-[3.75px] border-[#f4a285] rounded-3xl p-8 sm:p-14 flex flex-col justify-center items-center gap-3 w-full shadow-lg">

            <h1 class="text-[#ec6433] flex font-pixel text-3xl font-bold gap-2 mb-5"> Welcome 
                <img src="../public/image/heart.png" class="w-[40px] animate-bounce" alt="heart">
            </h1>

            <form id="login-form" class="flex flex-col gap-4 w-full max-w-[250px]">

                <input id="email" class="login-input input rounded-lg focus:border-none focus:outline-2 focus:outline-[#f4a285] tracking-wider" type="email" name="email"
                    placeholder="Email" required>

                <input id="password" class="login-input input rounded-lg focus:border-none focus:outline-2 focus:outline-[#f4a285] tracking-wider" type="password" name="password"
                    placeholder="Password" required>

                <p id="error-msg" class="text-xs text-red-500 font-bold hidden text-center leading-tight"></p>

                <button type="submit" id="btn-login" name="login"
                    class="btn bg-[#ec6433] rounded-lg text-white text-[15px] p-5 hover:bg-[#d55324]">Log in</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        // 1. ควบคุมแมวเด้งขึ้นด้วย translateY
        const catImg = document.getElementById('cat-img');
        const inputs = document.querySelectorAll('.login-input');

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                catImg.style.transform = 'translateY(-25px)'; // เด้งแมวขึ้นเมื่อโฟกัส
            });
            input.addEventListener('blur', () => {
                catImg.style.transform = 'translateY(0px)'; // ดึงแมวกลับตำแหน่งเดิม
            });
        });

        // 2. ล็อกอินด้วย Supabase
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            showError('');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Logging in...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showError(error.message);
                btnLogin.disabled = false;
                btnLogin.textContent = 'Log in';
            } else {
                window.location.replace('./menu.html');
            }
        });

        function showError(msg) {
            if (msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
            } else {
                errorMsg.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
