<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" href="/views/style.css">
</head>

<body>
    <div class="login-wrapper">
        <img src="/public/image/cat-login.png" class="cat">

        <div class="login-container">
            <h1 class="welcome"> Welcome <img src="/public/image/heart.png" class="heart" alt="heart"> </h1>

            <form class="input-card" method="POST">
                <div class="input">
                    <input type="text" name="name" placeholder="Name" required>
                </div>

                <div class="input">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" name="login" class="log-in-btn">Log in</button>
            </form>
        </div>
    </div>

</body>

</html>
