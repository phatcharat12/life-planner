<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        @font-face {
            font-family: 'Pixellari';
            src: url('/public/font/pixellari/Pixellari.ttf') format('truetype');
        }

        .font-pixel {
            font-family: 'Pixellari', sans-serif;
        }
    </style>

</head>

<body class="flex min-h-screen justify-center bg-[url('/public/image/bg.png')]">
    <div class="relative group flex flex-col justify-center w-[380px]">
        <img src="/public/image/cat-login.png" class="absolute bottom-[400px] left-[120px] w-[300px] transition-all duration-500 z-1 group-hover:bottom-[458px]">

        <div class="flex flex-col z-2 bg-white border-[3.75px] border-[#f4a285] rounded-3xl p-14 justify-center items-center gap-3">
            <h1 class="text-[#ff4500] flex font-pixel text-3xl font-bold gap-2 mb-5"> Welcome <img
                    src="/public/image/heart.png" class="w-[40px] animate-bounce" alt="heart">
            </h1>

            <form class="flex flex-col gap-4 w-[250px]">

                <input class="input rounded-lg focus:border-none focus:outline-2 focus:outline-[#f4a285]" type="text" name="name"
                    placeholder="Name" required>

                <input class="input rounded-lg focus:border-none focus:outline-2 focus:outline-[#f4a285]" type="password" name="password"
                    placeholder="Password" required>

                <button type="submit" name="login"
                    class="btn bg-[#ff4500] rounded-lg text-white text-[15px] p-5 hover:bg-[#ea3f01]">Log in</button>
            </form>
        </div>
    </div>

</body>

</html>
